<!DOCTYPE html>
<html>
<head>
  <title>YPSS CLASS - Lecturer Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin:0;
      font-family:Arial;
      background:#0f2027;
      color:white;
    }

    .sidebar {
      width:220px;
      height:100vh;
      background:#8b0000;
      position:fixed;
      padding:20px;
      box-sizing:border-box;
    }

    .main {
      margin-left:240px;
      padding:20px;
    }

    .card {
      background:#1c1c1c;
      padding:15px;
      border-radius:10px;
      margin-bottom:15px;
    }

    button {
      background:#00c6ff;
      border:none;
      padding:10px 14px;
      border-radius:6px;
      cursor:pointer;
      margin-top:8px;
      color:white;
      font-weight:bold;
    }

    input, textarea, select {
      width:100%;
      padding:10px;
      margin:5px 0;
      border-radius:6px;
      border:none;
      box-sizing:border-box;
    }

    .courseItem{
      background:rgba(255,255,255,0.1);
      padding:12px;
      border-radius:8px;
      margin-bottom:10px;
      cursor:pointer;
    }

    .courseItem:hover{
      background:rgba(255,255,255,0.2);
    }

    .submission{
      background:rgba(255,255,255,0.08);
      padding:12px;
      border-radius:8px;
      margin-bottom:10px;
    }

    .logo{
      width:120px;
      display:block;
      margin-bottom:20px;
    }

    @media(max-width:768px){

      .sidebar{
        display:none;
      }

      .main{
        margin-left:0;
        padding:15px;
      }
    }
  </style>
</head>

<body>

<div class="sidebar">
  <img src="images/logo.png" class="logo">

  <h2>👨‍🏫 Lecturer</h2>

  <button onclick="logout()">Logout</button>
</div>

<div class="main">

  <!-- COURSES -->
  <div class="card">
    <h3>📚 Subjects</h3>
    <div id="courses">Loading...</div>
  </div>

  <!-- ADD CONTENT -->
  <div class="card">
    <h3 id="selected">Select Subject</h3>

    <input id="folderName" placeholder="Folder Name (Example: Week 1 Notes)">

    <select id="matType">
      <option value="notes">Notes</option>
      <option value="videos">Video</option>
      <option value="lessons">Lesson Link</option>
    </select>

    <input id="matTitle" placeholder="Content Title">

    <input id="matContent" placeholder="Paste URL / Link">

    <button onclick="addMaterial()">Upload Content</button>
  </div>

  <!-- ANNOUNCEMENTS -->
  <div class="card">
    <h3>📢 Post Announcement</h3>

    <textarea id="announce" placeholder="Write announcement"></textarea>

    <button onclick="postAnnouncement()">Post Announcement</button>
  </div>

  <!-- SUBMISSIONS -->
  <div class="card">
    <h3>📝 Student Submissions</h3>

    <div id="submissions"></div>
  </div>

  <!-- LIVE CLASS -->
  <div class="card">
    <h3>🎥 Live Class (Zoom)</h3>

    <input id="zoomLink" placeholder="Paste Zoom Link">

    <button onclick="saveZoom()">Start Live Class</button>
  </div>

  <!-- RESULT SLIP -->
  <div class="card">
    <h3>🧾 Generate Result Slip</h3>

    <input id="studentEmail" placeholder="Student Email">

    <button onclick="generateSlip()">Generate Result Slip</button>
  </div>

</div>

<script>

const supabaseClient = window.supabase.createClient(
  "https://fwpkvimozkyshshosbgx.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3cGt2aW1vemt5c2hzaG9zYmd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNzM0MTksImV4cCI6MjA5MTQ5NDE5fQ.Q8IPJ-H-5HvTHSDDfgLCq0veuhbvLUXTEo20B2cdEa4"
);

const user = JSON.parse(localStorage.getItem("currentUser"));

if (!user) {
  alert("Login required");
  location.href = "login.html";
}

if (user.role !== "lecturer" && user.role !== "admin") {
  alert("Access denied");
  location.href = "dashboard.html";
}

let selectedCourse = "";

/* LOAD SUBJECTS */
async function loadCourses(){

  const { data = [] } = await supabaseClient
    .from("subjects")
    .select("*");

  let html = "";

  data.forEach(c=>{

    html += `
      <div class="courseItem" onclick="selectCourse('${c.title}')">
        📚 ${c.title}
      </div>
    `;
  });

  document.getElementById("courses").innerHTML =
    html || "No subjects available";
}

/* SELECT SUBJECT */
function selectCourse(name){

  selectedCourse = name;

  document.getElementById("selected").innerText =
    "Selected Subject: " + name;
}

/* ADD MATERIAL */
async function addMaterial(){

  if(!selectedCourse){
    alert("Select subject first");
    return;
  }

  const folderName = document.getElementById("folderName").value.trim();
  const type = document.getElementById("matType").value;
  const title = document.getElementById("matTitle").value.trim();
  const content = document.getElementById("matContent").value.trim();

  if(!folderName || !title || !content){
    alert("Fill all fields");
    return;
  }

  /* CREATE FOLDER */
  const { error: folderError } = await supabaseClient
    .from("folders")
    .insert({
      subject: selectedCourse,
      type: type,
      name: folderName
    });

  if(folderError && !folderError.message.includes("duplicate")){
    console.log(folderError);
  }

  /* ADD CONTENT */
  const { error } = await supabaseClient
    .from("materials")
    .insert({
      subject: selectedCourse,
      folder: folderName,
      title: title,
      type: type,
      content: content,
      created_by: user.email
    });

  if(error){
    console.log(error);
    alert("Upload failed");
    return;
  }

  alert("Content uploaded successfully ✅");

  document.getElementById("folderName").value = "";
  document.getElementById("matTitle").value = "";
  document.getElementById("matContent").value = "";
}

/* POST ANNOUNCEMENT */
async function postAnnouncement(){

  const message = document.getElementById("announce").value.trim();

  if(!message){
    alert("Write announcement");
    return;
  }

  const { error } = await supabaseClient
    .from("announcements")
    .insert({
      message: message
    });

  if(error){
    console.log(error);
    alert("Failed");
    return;
  }

  alert("Announcement posted ✅");

  document.getElementById("announce").value = "";
}

/* LOAD SUBMISSIONS */
async function loadSubmissions(){

  const { data = [] } = await supabaseClient
    .from("submissions")
    .select("*");

  let html = "";

  data.forEach((s, i)=>{

    html += `
      <div class="submission">

        <b>${s.studentEmail || "-"}</b><br><br>

        Subject:
        ${s.subject || "-"}<br><br>

        <input
          placeholder="Enter Grade %"
          onchange="grade('${s.id}', this.value)"
        >

      </div>
    `;
  });

  document.getElementById("submissions").innerHTML =
    html || "No submissions";
}

/* GRADE */
async function grade(id, score){

  let remark = "Fail";

  if(score >= 80){
    remark = "Excellent";
  }
  else if(score >= 60){
    remark = "Pass";
  }
  else if(score >= 50){
    remark = "Credit";
  }

  const { error } = await supabaseClient
    .from("submissions")
    .update({
      grade: score,
      remark: remark
    })
    .eq("id", id);

  if(error){
    console.log(error);
    alert("Failed");
    return;
  }

  alert("Graded successfully ✅");
}

/* SAVE LIVE CLASS */
async function saveZoom(){

  if(!selectedCourse){
    alert("Select subject first");
    return;
  }

  const link = document.getElementById("zoomLink").value.trim();

  if(!link){
    alert("Paste Zoom link");
    return;
  }

  const { error } = await supabaseClient
    .from("live_classes")
    .insert({
      subject: selectedCourse,
      link: link
    });

  if(error){
    console.log(error);
    alert("Failed");
    return;
  }

  alert("Live class started 🎥");

  document.getElementById("zoomLink").value = "";
}

/* GENERATE RESULT SLIP */
async function generateSlip(){

  const email = document.getElementById("studentEmail").value.trim();

  if(!email){
    alert("Enter student email");
    return;
  }

  const { data = [] } = await supabaseClient
    .from("submissions")
    .select("*")
    .eq("studentEmail", email);

  let text = "RESULT SLIP\n\n";

  data.forEach(s=>{

    text += `
Subject: ${s.subject || "-"}
Grade: ${s.grade || "Pending"}%
Remark: ${s.remark || "-"}
-------------------------
`;
  });

  const win = window.open();

  win.document.write("<pre>"+text+"</pre>");

  win.print();
}

/* LOGOUT */
function logout(){

  localStorage.removeItem("currentUser");

  location.href = "login.html";
}

/* INIT */
loadCourses();
loadSubmissions();

</script>

</body>
</html>
